name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest --cov=django_native_mcp --cov-report=term-missing

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linter
        run: python -m ruff check .

      - name: Run type checker
        run: python -m mypy django_native_mcp

      - name: Run Django system checks
        run: python -m django check --settings=tests.settings

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build distributions
        run: python -m pip install build && python -m build

      - name: Check distributions
        run: python -m pip install twine && python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
