[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-native-mcp"
version = "0.1.0"
description = "A Django-native MCP tool framework inspired by Celery."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Alex St (xelaxela13)" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2",
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/xelaxela13/django-native-mcp"
Repository = "https://github.com/xelaxela13/django-native-mcp"
Issues = "https://github.com/xelaxela13/django-native-mcp/issues"
Changelog = "https://github.com/xelaxela13/django-native-mcp/releases"

[project.optional-dependencies]
dev = [
    "build",
    "django-stubs",
    "httpx2",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-django",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["django_native_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["example/django_demo/db.sqlite3"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["django_native_mcp"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
packages = ["django_native_mcp"]

[tool.django-stubs]
django_settings_module = "tests.settings"
